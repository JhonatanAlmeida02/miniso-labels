<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador de Etiquetas (PDF por Gtin)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&family=Archivo+Black&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { background: #f0f0f0; }

    .controls {
        font-family: "Inter", sans-serif;
        padding: 16px 20px; background: #fff; border-bottom: 1px solid #ddd;
        display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
        position: sticky; top: 0; z-index: 10;
    }
    .controls h1 { font-size: 16px; font-weight: 700; }
    .controls input[type="file"] { font-size: 13px; }
    .controls button {
        font-size: 13px; font-weight: 500; cursor: pointer;
        padding: 8px 16px; border: none; border-radius: 6px; background: #ff8a00; color: #fff;
    }
    .controls button:disabled { background: #ccc; cursor: not-allowed; }
    .controls .status { font-size: 13px; color: #555; max-width: 520px; }
    .controls .erro { color: #c00; font-weight: 600; }

    #etiquetas { display: flex; flex-wrap: wrap; gap: 12px; padding: 20px; align-items: flex-start; }

    /* ============ ETIQUETA — layout original (141.75pt x 240.75pt) ============ */
    .etiqueta {
        width: 141.75pt; height: 240.75pt;
        background: #fff;
        font-family: "Roboto Condensed", sans-serif;
        border: 1pt black solid;
        font-size: 5pt;
    }
    .etiqueta .pai { display: flex; flex-direction: column; gap: 1pt; padding-left: 3pt; }
    .etiqueta .title {
        position: relative; font-weight: 700; font-size: 6pt;
        width: 133pt; height: 18pt; margin-top: 1.5pt;
    }
    .etiqueta .bodyComposicao {
        position: relative; font-size: 4.5pt; width: 133pt; height: 10pt;
    }
    .etiqueta .bodyContent {
        position: relative; font-size: 4.5pt; width: 133pt; height: 5pt;
    }
    .etiqueta .bodyImagem {
        position: relative; font-size: 5pt; width: 133pt; height: 49pt;
        display: flex; flex-direction: row;
    }
    .etiqueta .image { width: 68.51pt; }
    .etiqueta .bodyTextEmbalagem {
        position: relative; font-size: 4.5pt; width: 133pt; height: 28pt;
    }
    .etiqueta .textImage { display: flex; align-items: center; padding-left: 2pt; }
    .etiqueta .bodyTextImportador {
        position: relative; font-size: 4p.5t; width: 133pt; height: 43pt
    }

    /* Bloco Inmetro - fonte Arial/Helvetica (mais próxima do selo real) */
    .etiqueta .bodyImgInmetro {
        font-family: 'Arial Black', Arial, 'Helvetica Neue', Helvetica, sans-serif;
        margin-left: -1.7pt;
        font-weight: 900;
        position: relative; font-size: 5pt; width: 138.5pt; height: 65.2pt; border: 4pt solid black;
        background: black; /* faz as vezes da "borda" nos cantos, revelada atrás do arredondado interno */
    }
    /* Camada branca com raio interno -- fica rente à borda (padding box),
       arredondando só o lado de dentro; o quadro externo continua reto
       porque quem define o formato de fora é o .bodyImgImnetro acima, sem raio. */
    .etiqueta .bodyImgInmetro::before {
        content: "";
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: #fff;
        border-radius: 6pt;
        z-index: 0;
    }
    /* garante que o conteúdo (textos/imagens) fique acima da camada branca */
    .etiqueta .bodyImgInmetro > * { position: relative; z-index: 1; }
    .etiqueta .selo-seguranca   { position: absolute; top: 3.5pt;    left: 6.80pt;  font-weight: 200; font-size: 12pt; white-space: nowrap; }
    .etiqueta .selo-registro    { position: absolute; top: 23.08pt; left: 50pt; font-size: 5pt; text-align: center; line-height: 1.1; }
    .etiqueta .selo-brics       { position: absolute; top: 35pt; left: 7pt;  width: 23pt; }
    .etiqueta .selo-compulsorio { position: absolute; top: 39pt;    left: 29.15pt; font-weight: 400; font-size: 8pt; white-space: nowrap; }
    .etiqueta .selo-inmetro     { position: absolute; top: 22pt;    left: 95pt; width: 1.05cm; height: 1.1cm; }
    .etiqueta .aviso-erro { color: #c00; font-weight: 700;}

    .etiqueta .bodyLoteValidade {
        position: relative;
        font-size: 4.5pt;
        width: 133pt;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
    }
    .etiqueta .bodyLoteValidade .validade-gtin {
        text-align: right;
    }

    .etiqueta .aviso-asfixia {
        display: flex;
        align-items: center;   /* é isto que centraliza verticalmente */
        gap: 2pt;
    }
    .etiqueta .atencao {
        font-weight: 700;
        font-size: 6.5pt;
        white-space: nowrap;   /* impede "ATENÇÃO!" de quebrar em duas linhas */
        flex-shrink: 0;        /* impede que ele seja espremido */
    }

</style>
</head>
<body>

<div class="controls">
    <h1>Etiquetas → PDF por Gtin</h1>
    <input type="file" id="arquivo" accept=".xlsx,.xls">
    <button id="btnPdf" disabled>Gerar PDFs (ZIP)</button>
    <span class="status" id="status">Selecione a planilha .xlsx</span>
</div>

<div id="etiquetas"></div>

<script>
// =========================================================
//  Selos por faixa etária
// =========================================================
const AVISOS_IDADE = {
    "2 m": {
        imagem: "idade_atencao_2m.png",
        texto: `ESTE BRINQUEDO É RECOMENDÁVEL <br>
                PARA CRIANÇAS A PARTIR DE 2 (DOIS) MESES DE IDADE.`
    },
    "3 a": {
        imagem: "idade_atencao_3anos.png",
        texto: `ESTE BRINQUEDO NÃO É RECOMENDÁVEL <br>
                PARA CRIANÇAS MENORES DE 3 (TRÊS) <br>ANOS POR CONTER PARTE(S) <br>
                PEQUENA(S) QUE PODE(M) SER <br>ENGOLIDA(S) OU ASPIRADA(S).`
    },
    "6 a": {
        imagem: "idade_atencao_6anos.png",
        texto: `NÃO RECOMENDÁVEL PARA CRIANÇAS MENORES DE 3 (TRÊS) ANOS POR CONTER PARTE(S) PEQUENA(S) QUE PODE(M) SER ENGOLIDA(S) OU ASPIRADA(S)`
    },
    "12 m": {
        imagem:"idade_atencao_12m.png",
        texto: `ESTE BRINQUEDO <br>
        NÃO TEM RESTRIÇÃO <br>
        DE FAIXA ETÁRIA`
    },
    "5 a":{
        imagem: "idade_atencao_5anos.png",
        texto:`NÃO RECOMENDÁVEL PARA CRIANÇAS MENORES DE 3 (TRÊS) ANOS POR CONTER PARTES(S) PEQUENA(S) QUE PODE(M) SER ENGOLIDA(S) OU ASPIRADA(S)`
    },
        "4 a":{
        imagem: "idade_atencao_4anos.png",
        texto:`NÃO RECOMENDÁVEL PARA CRIANÇAS MENORES DE 3 (TRÊS) ANOS POR CONTER PARTE(S) PEQUENA(S) QUE PODE(M) SER ENGOLIDA(S) OU ASPIRADA(S)`
    }
};

function normalizarIdade(valor) {
    if (valor === null || valor === undefined) return "";
    const s = String(valor).toLowerCase().trim();
    const num = (s.match(/\d+/) || [])[0];
    if (s.includes("m")) return `${num || "2"} m`;
    if (num) return `${num} a`;
    return s;
}
function esc(v) {
    if (v === null || v === undefined || v === 0 || v === "0") return "";
    return String(v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function blocoIdade(idadeBruta) {
    const aviso = AVISOS_IDADE[normalizarIdade(idadeBruta)];
    if (!aviso) return {
        img: `<div class="aviso-erro" style="padding:2pt">IDADE?<br>${esc(idadeBruta)}</div>`,
        texto: `<p class="aviso-erro">IDADE NÃO RECONHECIDA: "${esc(idadeBruta)}".</p>`
    };
    return { img: `<img src="${aviso.imagem}" width="88.68" height="63.44" alt="">`, texto: `<p>${aviso.texto}</p>` };
}
function getGtin(linha) {
    for (const k of Object.keys(linha)) {
        const nk = k.toLowerCase().trim();
        if (nk === "gtin" || nk === "ean") {
            let v = linha[k];
            if (v === null || v === undefined) return "";
            if (typeof v === "number") return v.toLocaleString("fullwide", { useGrouping: false });
            return String(v).trim();
        }
    }
    return "";
}
function nomeArquivoSeguro(v) { return String(v).replace(/[\/\\:*?"<>|\r\n]+/g, "_").trim(); }

function montarEtiqueta(linha) {
    const nome = esc(linha.NomeProduto), conteudo = esc(linha.Conteudo),
          composicao = esc(linha.Composicao),
          registro = esc(linha.registro !== undefined ? linha.registro : linha.Registro),
          idade = blocoIdade(linha.Idade),
          gtin = esc(getGtin(linha));
    const el = document.createElement("div");
    el.className = "etiqueta";
    el.innerHTML = `
      <div class="pai">
        <div class="title">${nome}</div>
        <div class="bodyContent"> <strong>CONTÉM:</strong>1(UMA) UNIDADE ${conteudo}</div>
        <div class="bodyComposicao"><strong>COMPOSIÇÃO:</strong>${composicao}</div>
        <div class="bodyImagem">
            <div class="image">${idade.img}</div>
            <div class="textImage">${idade.texto}</div>
        </div>
        <div class="bodyTextEmbalagem">
                <p> ESTA EMBALAGEM NÃO É PARTE INTEGRANTE DO BRINQUEDO.<br>
                    RETIRAR A EMBALAGEM ANTES DE ENTREGAR O BRINQUEDO A<br>
                    CRIANÇA. GUARDAR A EMBALAGEM PARA EVENTUAIS CONSULTAS.</p>
            <div class="aviso-asfixia">
                <span class="atencao">ATENÇÃO!</span>
                <span>PARA EVITAR O PERIGO DE ASFIXIA, MANTER ESTA<br>
                            EMBALAGEM LONGE DO ALCANCE DAS CRIANÇAS.</span>
            </div>
        </div>
        <div class="bodyTextImportador">
            <p>
               <Strong>FABRICADO NA CHINA. IMPORTADO E DISTRIBUÍDO POR:</Strong> <br> 
               PRODIGY COMPANY LTDA. CNPJ: 24.579.215/0001-77 AFE: <br> 
               8.16.529-1 (X56116WL1720). <strong>ENDEREÇO:</strong> AV. HERMÓGENES <br>
               RELLA, 145 – GALPÃO 03 - DISTR. IND. ALFREDO RELLA, ITATIBA - SP,CEP 13255-400. <br> 
               SAC:SAC@PRODIGYCOMPANY.COM.BR WHATSAPP: <br> 
               +55 11 96630-9449.
            </p>
        </div>
        <div class="bodyImgInmetro">
            <div class="selo-seguranca">Segurança</div>
            <div class="selo-registro"> <Strong>Registro</Strong><br>${registro}</div>
            <img class="selo-brics" src="brics_logo.png" alt="bric's">
            <div class="selo-compulsorio">Compulsório</div>
            <img class="selo-inmetro" src="inmetro_logo.png">
        </div>
        <div class="bodyLoteValidade">
            <span>LOTE:<br>FABRICAÇÃO:</span>
            <span class="validade-gtin">VALIDADE INDETERMINADA<br> <Strong>GTIN:</Strong> ${gtin}</span>
        </div>
      </div>`;
    return el;
}

// =========================================================
//  Leitura da planilha
// =========================================================
const inputArquivo = document.getElementById("arquivo");
const container = document.getElementById("etiquetas");
const status = document.getElementById("status");
const btnPdf = document.getElementById("btnPdf");
let linhasValidas = [];

function setStatus(msg, erro=false){ status.textContent = msg; status.classList.toggle("erro", erro); }

inputArquivo.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setStatus("Lendo planilha...");
    const reader = new FileReader();
    reader.onload = (ev) => {
        try {
            const wb = XLSX.read(ev.target.result, { type: "array" });
            const ws = wb.Sheets[wb.SheetNames[0]];
            const linhas = XLSX.utils.sheet_to_json(ws, { defval: "" });
            linhasValidas = linhas.filter(l => String(l.NomeProduto || "").trim() !== "");
            container.innerHTML = "";
            linhasValidas.forEach(l => container.appendChild(montarEtiqueta(l)));
            const semGtin = linhasValidas.filter(l => !getGtin(l)).length;
            setStatus(`${linhasValidas.length} etiqueta(s) pronta(s).`
                + (semGtin ? ` (${semGtin} sem Gtin — nome de reserva)` : ""));
            btnPdf.disabled = linhasValidas.length === 0;
        } catch (err) { console.error(err); setStatus("Erro ao ler a planilha.", true); }
    };
    reader.readAsArrayBuffer(file);
});

// =========================================================
//  Espera fontes + imagens carregarem antes de capturar
// =========================================================
async function esperarAssets(root) {
    try { await document.fonts.ready; } catch (e) {}
    const imgs = Array.from(root.querySelectorAll("img"));
    await Promise.all(imgs.map(img =>
        (img.complete && img.naturalWidth) ? Promise.resolve()
        : new Promise(res => { img.addEventListener("load", res); img.addEventListener("error", res); })
    ));
    // pequeno respiro para o layout assentar
    await new Promise(r => setTimeout(r, 150));
}

// Detecta canvas totalmente branco (etiqueta em branco). Pode lançar se o canvas
// estiver "tainted" (imagens locais via file://) — tratamos isso como sinal claro.
function canvasEmBranco(canvas) {
    const ctx = canvas.getContext("2d");
    const { width: w, height: h } = canvas;
    const data = ctx.getImageData(0, 0, w, h).data; // lança SecurityError se tainted
    let naoBranco = 0;
    for (let i = 0; i < data.length; i += 4 * 50) {
        const r = data[i], g = data[i+1], b = data[i+2], a = data[i+3];
        if (a > 10 && (r < 240 || g < 240 || b < 240)) { if (++naoBranco > 15) return false; }
    }
    return true;
}

// =========================================================
//  Gera 1 PDF por etiqueta -> ZIP
// =========================================================
btnPdf.addEventListener("click", async () => {
    const etiquetas = Array.from(container.querySelectorAll(".etiqueta"));
    if (!etiquetas.length) return;

    const jsPDFCtor = (window.jspdf && window.jspdf.jsPDF) || window.jsPDF;
    if (!jsPDFCtor || typeof html2canvas !== "function") {
        setStatus("Bibliotecas não carregaram. Verifique a internet (CDN).", true); return;
    }

    btnPdf.disabled = true; inputArquivo.disabled = true;
    setStatus("Preparando (fontes e imagens)...");
    await esperarAssets(container);

    const zip = new JSZip();
    const usados = {};
    let avisouBranco = false;

    for (let i = 0; i < etiquetas.length; i++) {
        setStatus(`Gerando PDF ${i + 1} de ${etiquetas.length}...`);
        const el = etiquetas[i];

        let canvas;
        try {
            canvas = await html2canvas(el, {
                scale: 3, backgroundColor: "#ffffff", useCORS: true, logging: false,
                width: el.offsetWidth, height: el.offsetHeight,
                windowWidth: document.documentElement.scrollWidth
            });
        } catch (err) {
            console.error(err);
            setStatus("Falha ao renderizar. Rode via servidor local (veja instruções).", true);
            btnPdf.disabled = false; inputArquivo.disabled = false; return;
        }

        // diagnóstico da primeira etiqueta
        if (i === 0) {
            try {
                if (canvasEmBranco(canvas)) {
                    setStatus("As etiquetas saíram em branco. Abra o arquivo por um servidor "
                        + "local (ex.: python -m http.server) em vez de dar duplo clique.", true);
                    btnPdf.disabled = false; inputArquivo.disabled = false; return;
                }
            } catch (err) {
                // getImageData falhou => canvas tainted (imagens locais via file://)
                setStatus("O navegador bloqueou as imagens locais (file://). Rode por um "
                    + "servidor local: na pasta do arquivo, use  python -m http.server  e abra "
                    + "http://localhost:8000/  — depois gere novamente.", true);
                btnPdf.disabled = false; inputArquivo.disabled = false; return;
            }
        }

        let base = getGtin(linhasValidas[i]);
        base = base ? nomeArquivoSeguro(base) : `etiqueta_${String(i + 1).padStart(3, "0")}`;
        usados[base] = (usados[base] || 0) + 1;
        const nomeFinal = usados[base] > 1 ? `${base}_${usados[base]}` : base;

        const imgData = canvas.toDataURL("image/jpeg", 0.95);
        const pdf = new jsPDFCtor({ unit: "pt", format: [141.75, 240.75], orientation: "portrait" });
        pdf.addImage(imgData, "JPEG", 0, 0, 141.75, 240.75, undefined, "FAST");
        zip.file(`${nomeFinal}.pdf`, pdf.output("blob"));

        await new Promise(r => setTimeout(r, 0)); // deixa a UI respirar
    }

    setStatus("Compactando ZIP...");
    const zipBlob = await zip.generateAsync({ type: "blob" });
    const url = URL.createObjectURL(zipBlob);
    const a = document.createElement("a");
    a.href = url; a.download = "etiquetas.zip";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);

    setStatus(`Pronto! ${etiquetas.length} PDF(s) em etiquetas.zip.`);
    btnPdf.disabled = false; inputArquivo.disabled = false;
});
</script>
</body>
</html>
